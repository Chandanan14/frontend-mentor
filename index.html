<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin-bottom: 0;}
    .attribution a { color: hsl(228, 45%, 44%); }
    html,body{
      height: 100%;
      margin: 0;
    }

    body{
      background-color: hsl(212, 45%, 89%);
      font-family: Outfit;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }



    .heading{
      color: hsl(218, 44%, 22%);
      font-size: 22px;
      font-weight: 700;
    }

    .desc{
      color:  hsl(216, 15%, 48%);
        font-size: 15px;
        font-weight: 400;
    }

    .card{
      background-color:  hsl(0, 0%, 100%);
      width: 300px;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
     
    }

    main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

footer {
  margin-top: auto;
  text-align: center;
  padding: 1rem;
}

  </style>
</head>
<body>

  <main>
    <div class="card">
    <img src="images/image-qr-code.png" width="288px" height="288px">
    <p class="heading">    Improve your front-end skills by building projects</p>
    <p class="desc">Scan the QR code to Frontend Mentor and take your coding skills to the next level</p>
  </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Chandana N</a>.
  </footer>
</body>
</html>
